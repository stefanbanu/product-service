# Connection settings for liquibase-maven-plugin. The keys are the plugin's own parameter
# names, which is also the format the Liquibase CLI reads, so this file works for both.
#
# It sits at the module root rather than under src/main/resources deliberately: the app's
# pom copies that whole resource tree onto its classpath, so a file placed there would be
# packaged into the application jar - connection settings and all.
#
# Everything here can still be overridden per invocation, because the plugin leaves a
# parameter already set from the command line alone:
#     mvn -f liquibase/pom.xml liquibase:update -Dliquibase.url=jdbc:h2:file:/tmp/other
#
# searchPath cannot move here: the plugin resolves THIS file through the search path, so it
# has to be configured in pom.xml before the file can be read.

changeLogFile: db/changelog/db.changelog-master.xml

# A scratch H2 database in the user's home, not under target/. The path has to be absolute
# or ~-anchored: a plain ./target/... would resolve against whatever directory mvn was
# invoked from (the parent project's target/ when run as `mvn -f liquibase/pom.xml` from the
# repo root), and Maven expressions like ${project.basedir} are NOT interpolated in this
# file - H2 rejects the literal string.
#
# Consequence worth knowing: unlike the previous target/ location, `mvn clean` no longer
# resets this database. Use `mvn -f liquibase/pom.xml liquibase:dropAll` to start over.
url: jdbc:h2:file:~/.h2/product-service/productdb
driver: org.h2.Driver
username: sa
password:
